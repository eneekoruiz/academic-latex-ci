[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "academic-latex-ci"
version = "0.1.0"
description = "Continuous Integration, 2D Collision Detection, and Multi-Surface Synchronization for Academic LaTeX Papers and Theses."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Eneko Ruiz", email = "eneekoruiz@users.noreply.github.com" }
]
keywords = ["latex", "overleaf", "academic", "ci-cd", "layout-testing", "google-docs", "typography"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Text Processing :: Markup :: LaTeX",
]
dependencies = [
    "pypdfium2>=4.30.0",
    "python-docx>=1.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
academic-ci = "academic_latex_ci.cli:main"
overleaf-ci = "academic_latex_ci.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["academic_latex_ci*"]
